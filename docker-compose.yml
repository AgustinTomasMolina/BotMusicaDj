# MusiFlix — stack local con worker + cola.
#  web    → API/UI (encola el trabajo pesado)
#  worker → procesa la cola (descargas, análisis, espectrogramas)
#  cache  → Redis (la cola)
# (Postgres queda para F4 / web pública — placeholder comentado al final.)
name: musiflix

services:
  web:
    build:
      context: .
    image: musiflix:local
    ports:
      - "8000:8000"          # API REST + WebSocket /ws/console + front
    env_file:
      - path: .env
        required: false
    environment:
      MUSIFLIX_DATA_DIR: /data
      MUSIFLIX_DOWNLOADS: /data/downloads
      REDIS_URL: redis://cache:6379/0
      # Radio (/api/radio/*): la base del motor SIEMPRE se busca acá adentro. Qué se monta
      # en /djradio lo decide DJRADIO_DB_DIR (abajo); sin esa variable no hay base y la
      # radio contesta "sin configurar" — el resto de la web no se entera.
      DJRADIO_DB: /djradio/biblioteca.sqlite
    volumes:
      - musiflix-data:/data
      # --- Radio: base del motor + música. Las dos OPCIONALES -------------------------
      # Sin las variables se monta el volumen vacío `djradio-sin-configurar`, así el stack
      # levanta igual (quien no usa la radio no configura nada). Con ellas, cada una es una
      # carpeta del host: DJRADIO_DB_DIR la que tiene `biblioteca.sqlite`, DJRADIO_MUSICA la
      # de los audios. Rutas con / y absolutas, también en Windows (ver .env.example).
      #
      # La base va con ESCRITURA porque el store migra el esquema al abrir una base vieja
      # (motor/store.py); la música va `:ro` porque el proyecto nunca escribe el audio
      # original — es la regla, no una precaución.
      #
      # DJRADIO_MUSICA_EN_CONTENEDOR es dónde se monta la música: la base guarda rutas
      # ABSOLUTAS del scan, así que para poder reproducir tiene que montarse en la misma
      # ruta con la que se escaneó. Si no coincide, la radio arma el set igual y el preview
      # contesta 404 diciendo que el archivo no está en esta máquina.
      - ${DJRADIO_DB_DIR:-djradio-sin-configurar}:/djradio
      - ${DJRADIO_MUSICA:-djradio-sin-configurar}:${DJRADIO_MUSICA_EN_CONTENEDOR:-/musica}:ro
    depends_on:
      cache:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8000/',timeout=4).status==200 else 1)"]
      interval: 30s
      timeout: 5s
      start_period: 40s
      retries: 3
    restart: unless-stopped
    networks: [musiflix]

  worker:
    build:
      context: .
    image: musiflix:local     # misma imagen que web, distinto comando
    command: ["python", "-m", "worker"]
    env_file:
      - path: .env
        required: false
    environment:
      MUSIFLIX_DATA_DIR: /data
      MUSIFLIX_DOWNLOADS: /data/downloads
      REDIS_URL: redis://cache:6379/0
    volumes:
      - musiflix-data:/data   # comparte descargas + DB con web
    depends_on:
      cache:
        condition: service_healthy
    healthcheck:
      disable: true           # el worker no sirve HTTP; no aplica el check de la imagen
    restart: unless-stopped
    networks: [musiflix]

  cache:
    image: redis:7-alpine
    command: ["redis-server", "--save", "60", "1", "--loglevel", "warning"]
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
    restart: unless-stopped
    networks: [musiflix]

  # db:  # Postgres (+pgvector) — solo si el proyecto va a web pública (F4)
  #   image: postgres:16-alpine
  #   environment:
  #     POSTGRES_USER: musiflix
  #     POSTGRES_PASSWORD: musiflix
  #     POSTGRES_DB: musiflix
  #   volumes: [pgdata:/var/lib/postgresql/data]
  #   healthcheck:
  #     test: ["CMD-SHELL", "pg_isready -U musiflix -d musiflix"]
  #     interval: 10s
  #     timeout: 5s
  #     retries: 5
  #   networks: [musiflix]

volumes:
  musiflix-data:
  redisdata:
  # Volumen VACÍO a propósito: es el default de los montajes de la radio cuando
  # DJRADIO_DB_DIR / DJRADIO_MUSICA no están definidas. Un volumen nombrado siempre existe
  # (una ruta del host inventada, no: Docker la crearía como carpeta vacía en la máquina del
  # usuario), así que el stack levanta sin ninguna variable y la radio queda "sin base".
  djradio-sin-configurar:
  # pgdata:

networks:
  musiflix:
    driver: bridge

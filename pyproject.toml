[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "djradio"
version = "0.1.0"
description = "Motor de recomendación musical para DJs: arma sets mezclables por BPM, tonalidad Camelot y similitud sonora"
readme = "README.md"
requires-python = ">=3.11"
license = { file = "LICENSE" }
authors = [{ name = "Agustín Tomás Molina" }]
keywords = ["dj", "music-information-retrieval", "recommendation", "audio-analysis", "rekordbox"]
classifiers = [
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Multimedia :: Sound/Audio :: Analysis",
    "License :: OSI Approved :: MIT License",
]

dependencies = [
    "librosa>=0.10.1",      # análisis de audio: onsets, chroma, HPSS
    "numpy>=1.26",
    "scipy>=1.11",
    "soundfile>=0.12",      # I/O de audio (wav/flac); mp3 vía ffmpeg
    "mutagen>=1.47",        # lectura de tags (artista, título, álbum)
    "typer>=0.12",          # CLI
    "rich>=13.7",           # tablas y salida en consola
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.6",
]
# Embeddings de producción — pesados, se instalan aparte:
#   pip install -e ".[ml]"
ml = [
    "torch>=2.2",
    "laion-clap>=1.1.6",
]

[project.scripts]
djradio = "djradio.cli:app"

[project.urls]
Repository = "https://github.com/AgustinTomasMolina/BotMusicaDj"

[tool.hatch.build.targets.wheel]
packages = ["src/djradio"]

# ---------------------------------------------------------------------------

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["E501"]  # el formatter ya se encarga del largo de línea

[tool.ruff.lint.isort]
known-first-party = ["djradio"]

# ---------------------------------------------------------------------------

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers"
markers = [
    "slow: tests que analizan audio real (se saltean con -m 'not slow')",
]

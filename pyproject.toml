[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "djradio"
version = "0.1.0"
description = "Motor de recomendación musical para DJs: arma sets mezclables por BPM, tonalidad Camelot y similitud sonora"
readme = "README.md"
requires-python = ">=3.11"
license = { file = "LICENSE" }
authors = [{ name = "Agustín Tomás Molina" }]
keywords = ["dj", "music-information-retrieval", "recommendation", "audio-analysis", "rekordbox"]
classifiers = [
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Multimedia :: Sound/Audio :: Analysis",
    "License :: OSI Approved :: MIT License",
]

# Dependencias del MOTOR únicamente (motor/, benchmark/, ground_truth/).
# Las del bot MusiFlix (fastapi, yt-dlp, spotipy, ...) viven en requirements.txt.
dependencies = [
    "librosa>=0.10.2",
    "numpy>=1.26,<2.1",     # numba (dep de librosa) aún no soporta numpy 2.1+
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.6",
]

[project.urls]
Repository = "https://github.com/AgustinTomasMolina/BotMusicaDj"

# Layout plano: los paquetes del motor están en la raíz del repo, no en src/.
[tool.hatch.build.targets.wheel]
packages = ["motor", "benchmark", "ground_truth"]

# ---------------------------------------------------------------------------

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["motor", "benchmark", "ground_truth"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["E501"]  # el formatter ya se encarga del largo de línea

[tool.ruff.lint.isort]
known-first-party = ["motor", "benchmark", "ground_truth"]

# ---------------------------------------------------------------------------

[tool.pytest.ini_options]
testpaths = ["motor/tests", "benchmark/tests", "ground_truth/tests"]
addopts = "-q --strict-markers"
markers = [
    "slow: tests que analizan audio real (se saltean con -m 'not slow')",
]
